[workspace]
members = [
  "crates/engine-cli",
  "crates/engine-contracts",
  "crates/engine-core",
  "crates/engine-gst",
  "crates/engine-language"
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tree-sitter = "0.25.10"
tree-sitter-java = "0.23.5"
tree-sitter-c = "0.21.4"
tree-sitter-cpp = "0.23.4"

